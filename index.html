<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KACUNG AI — Offline Solver</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        :root {
            --bg: #09090b;
            --panel: #18181b;
            --accent: #00ffcc;
            --accent-dim: rgba(0, 255, 204, 0.1);
            --text: #e4e4e7;
            --text-dim: #a1a1aa;
            --border: #27272a;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        
        body {
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            background-image: 
                linear-gradient(var(--border) 1px, transparent 1px),
                linear-gradient(90deg, var(--border) 1px, transparent 1px);
            background-size: 30px 30px;
            background-position: center;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5), 0 0 0 1px var(--border);
            position: relative;
            z-index: 10;
            animation: fadeUp 0.6s ease-out;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 800;
            text-align: center;
            letter-spacing: 2px;
            margin-bottom: 20px;
            color: var(--accent);
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.3);
        }

        .scanner-container {
            position: relative;
            width: 100%;
            height: 200px;
            border: 2px dashed var(--border);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            overflow: hidden;
            background: #000;
            transition: all 0.3s;
        }

        .scanner-container:hover { border-color: var(--accent); background: var(--accent-dim); }

        .scanner-line {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 2px;
            background: var(--accent);
            box-shadow: 0 0 10px var(--accent);
            animation: scan 2s linear infinite;
            display: none;
        }

        @keyframes scan {
            0% { top: 0; }
            50% { top: 100%; }
            100% { top: 0; }
        }

        .scanner-container.scanning .scanner-line { display: block; }

        #previewImg {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            display: none;
        }

        .text-overlay {
            position: absolute;
            color: var(--text-dim);
            font-size: 0.9rem;
            text-align: center;
            pointer-events: none;
        }

        #previewImg[src] ~ .text-overlay { display: none; }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 16px;
            background: var(--accent);
            color: #000;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        button:hover:not(:disabled) { background: #00ccaa; box-shadow: 0 0 15px rgba(0, 255, 204, 0.4); }
        button:disabled { background: var(--border); color: var(--text-dim); cursor: not-allowed; }

        .progress-bar {
            width: 100%;
            height: 4px;
            background: var(--border);
            border-radius: 2px;
            margin-top: 10px;
            overflow: hidden;
            display: none;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: var(--accent);
            transition: width 0.3s ease;
        }

        .status {
            text-align: center;
            font-size: 0.85rem;
            margin-top: 10px;
            color: var(--accent);
            min-height: 20px;
            font-family: monospace;
        }

        .result-box {
            margin-top: 20px;
            background: #000;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px;
            display: none;
            animation: fadeIn 0.4s;
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .result-box h3 {
            font-size: 0.8rem;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .result-content {
            font-family: monospace;
            font-size: 0.9rem;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .result-content.ocr { color: #888; border-left: 2px solid #444; padding-left: 10px; margin-bottom: 15px;}
        .result-content.ai { color: var(--accent); text-shadow: 0 0 2px var(--accent-dim); }

        input[type="file"] { display: none; }
        
        .blink { animation: blink 1s step-end infinite; }
        @keyframes blink { 50% { opacity: 0; } }
    </style>
</head>
<body>

    <div class="container">
        <h1>⚡ KACUNG AI ⚡</h1>
        
        <div class="scanner-container" id="dropZone">
            <img id="previewImg" alt="Preview">
            <div class="text-overlay">Klik untuk Upload Screenshot<br><small>(atau ambil foto)</small></div>
            <div class="scanner-line"></div>
            <input type="file" id="fileInput" accept="image/*" capture="environment">
        </div>

        <button id="solveBtn" disabled>PROSES SOAL</button>
        
        <div class="progress-bar" id="progBar">
            <div class="progress-fill" id="progFill"></div>
        </div>
        
        <div class="status" id="statusText">Menunggu gambar...</div>

        <div class="result-box" id="resultBox">
            <h3>Teks Layar (OCR)</h3>
            <div class="result-content ocr" id="ocrText">...</div>
            <h3>Jawaban AI</h3>
            <div class="result-content ai" id="aiText">...</div>
        </div>
    </div>

    <script type="module">
        import * as webllm from "https://esm.run/@mlc-ai/web-llm";

        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const previewImg = document.getElementById('previewImg');
        const solveBtn = document.getElementById('solveBtn');
        const statusText = document.getElementById('statusText');
        const progBar = document.getElementById('progBar');
        const progFill = document.getElementById('progFill');
        const resultBox = document.getElementById('resultBox');
        const ocrText = document.getElementById('ocrText');
        const aiText = document.getElementById('aiText');

        let currentImage = null;
        let engine = null;

        // Model yang didukung WebLLM (butuh WebGPU)
        const selectedModel = "Qwen2-0.5B-Instruct-q4f16_1-MLC";

        // 1. HANDLE UPLOAD GAMBAR
        dropZone.addEventListener('click', () => fileInput.click());

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (event) => {
                currentImage = event.target.result;
                previewImg.src = currentImage;
                previewImg.style.display = 'block';
                solveBtn.disabled = false;
                statusText.textContent = "Gambar siap. Klik 'PROSES SOAL'.";
                statusText.style.color = "var(--accent)";
                resultBox.style.display = 'none';
            };
            reader.readAsDataURL(file);
        });

        // 2. PROSES AI & OCR
        solveBtn.addEventListener('click', async () => {
            if (!currentImage) return;

            solveBtn.disabled = true;
            resultBox.style.display = 'none';
            dropZone.classList.add('scanning');
            
            // TAHAP 1: OCR (Tesseract.js)
            statusText.innerHTML = '<span class="blink">Membaca teks layar...</span>';
            progBar.style.display = 'block';
            progFill.style.width = '10%';

            try {
                const worker = await Tesseract.createWorker('eng+ind');
                const ret = await worker.recognize(currentImage);
                const text = ret.data.text.trim();
                await worker.terminate();

                progFill.style.width = '40%';

                if (!text) {
                    throw new Error("Tidak ada teks yang terdeteksi di gambar.");
                }

                ocrText.textContent = text;
                statusText.innerHTML = '<span class="blink">Memuat model AI (pertama kali butuh waktu)...</span>';

                // TAHAP 2: Inisialisasi WebLLM (Offline AI)
                if (!engine) {
                    const initProgressCallback = (report) => {
                        statusText.innerHTML = `<span class="blink">${report.text}</span>`;
                    };
                    engine = await webllm.CreateMLCEngine(selectedModel, { initProgressCallback });
                }

                progFill.style.width = '70%';
                statusText.innerHTML = '<span class="blink">Menganalisis & menjawab...</span>';

                // TAHAP 3: Prompt Engineering
                const prompt = `Kamu adalah asisten ujian yang sangat pintar. Baca teks soal berikut dan jawab dengan TEPAT dan SINGKAT.

Teks Layar:
"""
${text}
"""

Instruksi:
- Jika ini pilihan ganda, jawab dengan format: "Jawaban: [Huruf]. [Alasan singkat]"
- Jika ini matematika, tunjukkan hasil akhirnya.
- Jika isian, jawab langsung.
Jangan basa-basi.`;

                const messages = [
                    { role: "system", content: "You are a helpful and accurate exam solver." },
                    { role: "user", content: prompt }
                ];

                // TAHAP 4: Generate Answer (Streaming)
                const chunks = await engine.chat.completions.create({
                    messages,
                    temperature: 0.3,
                    max_tokens: 512,
                    stream: true,
                });

                aiText.textContent = "";
                resultBox.style.display = 'block';
                progFill.style.width = '100%';

                let fullReply = "";
                for await (const chunk of chunks) {
                    const delta = chunk.choices[0]?.delta?.content || "";
                    fullReply += delta;
                    aiText.textContent = fullReply;
                    window.scrollTo(0, document.body.scrollHeight);
                }

                statusText.textContent = "Selesai!";
                statusText.style.color = "var(--accent)";

            } catch (err) {
                console.error(err);
                statusText.textContent = "Error: " + err.message;
                statusText.style.color = "#ff4444";
                aiText.textContent = "Gagal memproses. Pastikan browser mendukung WebGPU (Chrome/Edge terbaru) dan koneksi internet stabil saat pertama kali memuat model.";
                resultBox.style.display = 'block';
            } finally {
                solveBtn.disabled = false;
                dropZone.classList.remove('scanning');
                setTimeout(() => { progBar.style.display = 'none'; progFill.style.width = '0%'; }, 2000);
            }
        });
    </script>
</body>
</html>
